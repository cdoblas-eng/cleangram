<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BetterInsta</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>BetterInsta</h1>
      <p>Menos ruido, más foco.</p>
    </header>
    <main>
      <label class="switch">
        <span>Reels</span>
        <input type="checkbox" id="reels" />
        <span class="slider"></span>
      </label>
      <label class="switch">
        <span>Explorar</span>
        <input type="checkbox" id="explore" />
        <span class="slider"></span>
      </label>
      <label class="switch">
        <span>Solo Siguiendo</span>
        <input type="checkbox" id="followingOnly" />
        <span class="slider"></span>
      </label>
    </main>
    <footer>Los cambios se aplican al instante.</footer>
    <script src="popup.js"></script>
  </body>
</html>
