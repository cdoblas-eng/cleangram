<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CleanGram</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        max-width: 720px;
        margin: 0 auto;
        padding: 64px 20px;
        font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1a1a1a;
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #e8e8e8;
          background: #0d0d0d;
        }
        a {
          color: #34d399;
        }
      }
      h1 {
        font-size: 32px;
        margin-bottom: 4px;
      }
      .tag {
        color: #6b7280;
        margin-top: 0;
      }
      ul {
        line-height: 1.9;
      }
      a {
        color: #0f9b8e;
      }
    </style>
  </head>
  <body>
    <h1>CleanGram</h1>
    <p class="tag">Menos scroll, más foco.</p>
    <p>
      Extensión de Chrome que oculta Reels, Explorar y publicaciones sugeridas,
      deja solo el feed de Siguiendo y bloquea el scroll infinito de Instagram web.
    </p>
    <ul>
      <li><a href="privacy.html">Política de privacidad</a></li>
      <li><a href="https://github.com/cdoblas-eng/cleangram">Código fuente en GitHub</a></li>
      <li>
        <a href="https://chrome.google.com/webstore/devconsole">Chrome Web Store</a>
        (próximamente)
      </li>
    </ul>
  </body>
</html>
